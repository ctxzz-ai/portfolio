<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retro Grid</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: linear-gradient(#2b1055, #7597de);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font-family: 'Outfit', sans-serif;
        color: rgba(255, 255, 255, 0.75);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: clamp(0.6rem, 1.2vw, 0.75rem);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="overlay">Retro Grid</div>
    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

      const canvas = document.getElementById('canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x2b1055, 0.15);

      const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 5);




      const geometry = new THREE.PlaneGeometry(20, 20, 20, 20);
      const material = new THREE.MeshBasicMaterial({
        color: 0xff00ff,
        wireframe: true,
        transparent: true,
        opacity: 0.5
      });
      const grid = new THREE.Mesh(geometry, material);
      grid.rotation.x = -Math.PI / 2;
      grid.position.y = -1;
      scene.add(grid);

      const sunGeo = new THREE.CircleGeometry(2, 32);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
      const sun = new THREE.Mesh(sunGeo, sunMat);
      sun.position.z = -5;
      sun.position.y = 1;
      scene.add(sun);


      const clock = new THREE.Clock();

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();

      }

      function animate() {
        const elapsed = clock.getElapsedTime();

        grid.position.z = (elapsed * 2) % 1;

        renderer.render(scene, camera);
      }

      resize();
      window.addEventListener('resize', resize);
      renderer.setAnimationLoop(animate);
    </script>
  </body>
</html>
